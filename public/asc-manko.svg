<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mankoGold" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <linearGradient id="mankoGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="mankoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Crest Shield -->
  <circle cx="250" cy="250" r="236" fill="url(#mankoGreen)" stroke="url(#mankoBorder)" stroke-width="12" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#FDE68A" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Inner Crest Ring -->
  <circle cx="250" cy="250" r="162" fill="#064E3B" stroke="url(#mankoBorder)" stroke-width="6" />

  <!-- Regal African Lion Head (Symbol of Manko) -->
  <g transform="translate(145, 135) scale(0.85)">
    <!-- Lion Mane Radiating Petals/Hair -->
    <path d="M 125 15 C 105 15, 75 35, 60 60 C 40 50, 20 65, 15 90 C 5 110, 10 135, 20 150 C 5 170, 10 195, 25 210 C 20 230, 35 250, 55 255 C 75 270, 100 270, 125 265 C 150 270, 175 270, 195 255 C 215 250, 230 230, 225 210 C 240 195, 245 170, 230 150 C 240 135, 245 110, 235 90 C 230 65, 210 50, 190 60 C 175 35, 145 15, 125 15 Z" 
          fill="url(#mankoGold)" stroke="#78350F" stroke-width="5" />
    
    <!-- Lion Face Silhouette -->
    <path d="M 125 60 C 95 60, 75 85, 75 125 C 75 160, 95 185, 125 205 C 155 185, 175 160, 175 125 C 175 85, 155 60, 125 60 Z" 
          fill="#FEF3C7" stroke="#92400E" stroke-width="4" />

    <!-- Lion Ears -->
    <path d="M 68 85 C 55 65, 65 45, 85 55 Z" fill="url(#mankoGold)" stroke="#78350F" stroke-width="3" />
    <path d="M 182 85 C 195 65, 185 45, 165 55 Z" fill="url(#mankoGold)" stroke="#78350F" stroke-width="3" />

    <!-- Lion Eyes & Brow -->
    <path d="M 92 110 Q 105 105 112 118" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round" />
    <polygon points="98,115 108,118 100,123" fill="#78350F" />
    
    <path d="M 158 110 Q 145 105 138 118" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round" />
    <polygon points="152,115 142,118 150,123" fill="#78350F" />

    <!-- Lion Muzzle & Nose -->
    <polygon points="125,145 115,135 135,135" fill="#78350F" />
    <path d="M 125 145 L 125 165 C 115 165, 105 160, 98 155" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
    <path d="M 125 165 C 135 165, 145 160, 152 155" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round" />

    <!-- Whiskers -->
    <line x1="85" y1="150" x2="60" y2="148" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
    <line x1="85" y1="156" x2="62" y2="160" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
    <line x1="165" y1="150" x2="190" y2="148" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
    <line x1="165" y1="156" x2="188" y2="160" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />

    <!-- Soccer Ball underneath chin -->
    <g transform="translate(125, 230) scale(0.65)">
      <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#064E3B" stroke-width="3" />
      <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#047857" />
      <line x1="0" y1="-12" x2="0" y2="-28" stroke="#047857" stroke-width="2.5" />
      <line x1="11" y1="-4" x2="26" y2="-10" stroke="#047857" stroke-width="2.5" />
      <line x1="7" y1="10" x2="18" y2="24" stroke="#047857" stroke-width="2.5" />
      <line x1="-7" y1="10" x2="-18" y2="24" stroke="#047857" stroke-width="2.5" />
      <line x1="-11" y1="-4" x2="-26" y2="-10" stroke="#047857" stroke-width="2.5" />
    </g>
  </g>

  <!-- Arched Text Top: ASC MANKO -->
  <path id="textArcTop" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#FDE68A" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ASC MANKO
    </textPath>
  </text>

  <!-- Arched Text Bottom: MBACKÉ • TOUBA -->
  <path id="textArcBottom" d="M 425 255 A 175 175 0 0 1 75 255" fill="none" />
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      MBACKÉ • SÉNÉGAL
    </textPath>
  </text>

  <!-- 3 Golden Stars Top -->
  <g fill="url(#mankoGold)" stroke="#78350F" stroke-width="1.5">
    <!-- Center star -->
    <polygon points="250,30 254,42 267,42 256,50 260,62 250,54 240,62 244,50 233,42 246,42" />
    <!-- Left star -->
    <polygon points="215,36 218,46 229,46 220,53 223,63 215,57 207,63 210,53 201,46 212,46" />
    <!-- Right star -->
    <polygon points="285,36 288,46 299,46 290,53 293,63 285,57 277,63 280,53 271,46 282,46" />
  </g>
</svg>
