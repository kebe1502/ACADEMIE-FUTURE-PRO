<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="eliteRed" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
    <linearGradient id="eliteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="236" fill="url(#eliteRed)" stroke="url(#eliteGold)" stroke-width="12" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#FEF08A" stroke-width="3" stroke-dasharray="6 5" />

  <!-- Big Shining Star with Baobab Tree -->
  <g transform="translate(250, 240) scale(1.1)">
    <!-- Central Golden Star -->
    <polygon points="0,-100 24,-28 98,-28 38,16 60,88 0,44 -60,88 -38,16 -98,-28 -24,-28" fill="url(#eliteGold)" stroke="#78350F" stroke-width="4" />
    <circle cx="0" cy="0" r="30" fill="#1E293B" stroke="#FEF08A" stroke-width="3" />
    <!-- Ball inside star center -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
    <polygon points="0,-7 6,-2 4,6 -4,6 -6,-2" fill="#DC2626" />
  </g>

  <!-- Arched Text Top: ÉLITE MBACKÉ BAOL -->
  <path id="embArcTop" d="M 65 250 A 185 185 0 0 1 435 250" fill="none" />
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#FEF08A" letter-spacing="3">
    <textPath href="#embArcTop" startOffset="50%" text-anchor="middle">
      ÉLITE MBACKÉ BAOL
    </textPath>
  </text>

  <!-- Arched Text Bottom: ACADÉMIE DE FOOTBALL -->
  <path id="embArcBottom" d="M 435 255 A 185 185 0 0 1 65 255" fill="none" />
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="3">
    <textPath href="#embArcBottom" startOffset="50%" text-anchor="middle">
      ACADÉMIE • MBACKÉ
    </textPath>
  </text>
</svg>
